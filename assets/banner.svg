<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="dormouse-core: the discipline layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100e"/>
      <stop offset="1" stop-color="#1d1915"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fd0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect y="318" width="1200" height="2" fill="url(#rule)"/>

  <!-- the mark: a grid where one cell reports and eight stay silent -->
  <g transform="translate(84 96)" fill="none" stroke="#4a443c" stroke-width="2">
    <rect x="0" y="0" width="36" height="36"/>
    <rect x="44" y="0" width="36" height="36"/>
    <rect x="88" y="0" width="36" height="36"/>
    <rect x="0" y="44" width="36" height="36"/>
    <rect x="44" y="44" width="36" height="36"/>
    <rect x="88" y="44" width="36" height="36"/>
    <rect x="0" y="88" width="36" height="36"/>
    <rect x="44" y="88" width="36" height="36"/>
  </g>
  <rect x="128" y="140" width="36" height="36" fill="#2f6fd0"/>

  <text x="240" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="64" fill="#f6f3ec" letter-spacing="-1">dormouse-core</text>
  <text x="242" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" fill="#a89f92" letter-spacing="3">COUNTERS · COEFFECTS · EFFECTS</text>
  <text x="242" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" fill="#6f675d">a mechanism that does not report is a mechanism that did not run</text>
</svg>
