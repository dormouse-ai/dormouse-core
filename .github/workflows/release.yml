name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    # No timeout-minutes here: a job that calls a reusable workflow may only use
    # name/uses/with/secrets/strategy/needs/if/concurrency/permissions. The
    # timeout belongs on the called workflow's own jobs, where it already is.
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to pypi and cut a release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI mints the token from OIDC
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build sdist and wheel from the tag
        run: pip install build && python -m build
      - name: publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # PEP 740: sign the uploads with this workflow's OIDC identity, so PyPI
          # can prove the wheel came from this repository and this commit.
          attestations: true
      # GitHub's own generator, called explicitly so the notes are a step with an
      # output rather than a flag: commits and PR titles since the previous tag, so a
      # release page is never empty and never a hand-written summary that rots.
      - name: release notes from the commits since the previous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > NOTES.md
          test -s NOTES.md
          wc -l NOTES.md
      - name: github release with the artifacts and those notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --notes-file NOTES.md
      - name: what to configure when publishing is not set up yet
        if: failure()
        run: |
          echo "::error::Publishing failed. If it failed at the publish step, PyPI trusted publishing is not configured for this project."
          echo "Add a pending publisher at https://pypi.org/manage/account/publishing/ with exactly:"
          echo "  PyPI project name : dormouse-core"
          echo "  Owner             : dormouse-ai"
          echo "  Repository name   : dormouse-core"
          echo "  Workflow name     : release.yml"
          echo "  Environment name  : pypi"
          echo "Then re-run this workflow. No PyPI token is stored in this repository."

  sbom:
    name: sbom
    # After publish, so the bill of materials describes exactly what shipped. No
    # timeout-minutes here for the reason the `checks` job gives above: the timeout
    # belongs on the called workflow's own jobs, where it already is. The release
    # is cut with GITHUB_TOKEN, and a release created by a token does not trigger a
    # `release:` workflow, so this is a call and not an event.
    needs: publish
    uses: ./.github/workflows/sbom.yml
