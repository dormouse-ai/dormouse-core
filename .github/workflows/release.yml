name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    # No timeout-minutes here: a job that calls a reusable workflow may only use
    # name/uses/with/secrets/strategy/needs/if/concurrency/permissions. The
    # timeout belongs on the called workflow's own jobs, where it already is.
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to pypi and cut a release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI mints the token from OIDC
      contents: write # gh release create
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build sdist and wheel from the tag
        run: pip install build && python -m build
      - name: publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # PEP 740: sign the uploads with this workflow's OIDC identity, so PyPI
          # can prove the wheel came from this repository and this commit.
          attestations: true
      - name: github release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
      - name: what to configure when publishing is not set up yet
        if: failure()
        run: |
          echo "::error::Publishing failed. If it failed at the publish step, PyPI trusted publishing is not configured for this project."
          echo "Add a pending publisher at https://pypi.org/manage/account/publishing/ with exactly:"
          echo "  PyPI project name : dormouse-core"
          echo "  Owner             : dormouse-ai"
          echo "  Repository name   : dormouse-core"
          echo "  Workflow name     : release.yml"
          echo "  Environment name  : pypi"
          echo "Then re-run this workflow. No PyPI token is stored in this repository."
