name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      # The lockfile is the install: --frozen refuses a stale one instead of resolving.
      - run: uv sync --frozen --extra dev
      - name: lint
        run: uv run --no-sync ruff check .
      - name: format
        run: uv run --no-sync ruff format --check .
      - name: types
        run: uv run --no-sync mypy src
      - name: tests
        run: uv run --no-sync python -m pytest --cov --cov-report=term-missing

  gates:
    name: invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      # Alone, so a red invariant is a named check rather than one line inside a
      # 4-version matrix: silence is an error, deactivate is exact, config refuses.
      - name: the invariants
        run: uv run --no-sync python -m pytest tests/gates -q

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - name: the wheel imports, and ships py.typed, from a clean venv
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/python" -c "import dormouse_core, pathlib; p = pathlib.Path(dormouse_core.__file__).parent; assert (p / 'py.typed').is_file(), p"
      # Every run keeps the wheel it built, so a reviewer can download exactly the
      # artifact these checks ran against.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: audit the built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install build pip-audit
      - run: python -m build
      - name: install the wheel and audit what it drags in
        run: |
          pip install dist/*.whl
          pip-audit

  api-frozen:
    name: public api is frozen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: compare the public surface with the recorded one
        run: python tools/dump_api.py > /tmp/api.txt && diff -u api.txt /tmp/api.txt
      - name: say what to do when it differs
        if: failure()
        run: |
          echo "Public API changed."
          echo "If intended: regenerate api.txt in the same commit and bump the version."
          echo "If not: revert the signature change."
