name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      # The lockfile is the install: --frozen refuses a stale one instead of resolving.
      - run: uv sync --frozen --extra dev
      - name: lint
        run: uv run --no-sync ruff check .
      - name: format
        run: uv run --no-sync ruff format --check .
      - name: types
        run: uv run --no-sync mypy src
      - name: tests
        run: uv run --no-sync python -m pytest --cov --cov-report=term-missing

  gates:
    name: invariant gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      # Alone, so a red invariant is a named check rather than one line inside a
      # 4-version matrix: silence is an error, deactivate is exact, config refuses.
      - name: the invariants
        run: uv run --no-sync python -m pytest tests/gates -q

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - name: the wheel imports, and ships py.typed, from a clean venv
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/python" -c "import dormouse_core, pathlib; p = pathlib.Path(dormouse_core.__file__).parent; assert (p / 'py.typed').is_file(), p"
      # Every run keeps the wheel it built, so a reviewer can download exactly the
      # artifact these checks ran against.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: audit the dependency closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pip-audit
      # Audit the project, not a throwaway env: that is the set users resolve, and
      # it keeps build tools (a stale setuptools) out of a security gate.
      - name: audit the dependencies this package declares
        run: pip-audit .

  api-frozen:
    name: public api is frozen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: compare the public surface with the recorded one
        run: python tools/dump_api.py > /tmp/api.txt && diff -u api.txt /tmp/api.txt
      - name: say what to do when it differs
        if: failure()
        run: |
          echo "Public API changed."
          echo "If intended: regenerate api.txt in the same commit and bump the version."
          echo "If not: revert the signature change."
