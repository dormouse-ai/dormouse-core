[project]
name = "dormouse-core"
version = "0.1.0"
description = "Counters, coeffects, reversible effects and loud errors: the discipline layer. No dependencies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dormouse_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/dormouse_core/py.typed" = "dormouse_core/py.typed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH", "RUF", "D"]
ignore = ["D203", "D213", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["dormouse_core"]

# The measured number on 2026-11-15 was 94%. The floor sits just below it, so an
# honest regression fails the build and a refactor that drops one line does not.
[tool.coverage.report]
fail_under = 92
show_missing = true
